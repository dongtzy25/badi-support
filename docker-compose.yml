# Full stack:   docker compose up --build      -> http://localhost:8080
# Database only (for local development):  docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: badi
      POSTGRES_PASSWORD: badi
      POSTGRES_DB: badi_support
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badi -d badi_support"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://badi:badi@db:5432/badi_support
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
